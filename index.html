<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">

<meta name="theme-color" content="#789b75">
<meta name="description" content="LUMILASH: FRONTLINE COLORSTORM. Aim and fire from the bottom rail to stop overwhelming descending rainbow enemy formations. No idle kills.">
<title>LUMILASH: CLASSIC SKY RAID — V7 Tenfold Horde</title>
<link rel="icon" href="icon.png" type="image/png">
<link rel="stylesheet" href="style.css?v=7">
</head><body>
<main id="app" data-scene="menu">
<canvas id="arena" aria-label="Manual aim-and-fire vertical arcade shooter. Hold pointer or Space to shoot." role="img"></canvas>
<div id="hud">
 <div class="hudLeft"><div class="eyebrow">LUMILASH <b>SKY RAID</b></div><div class="base">BASE <strong id="baseHP">100</strong><div class="progress"><span id="baseFill"></span></div></div></div>
 <div class="hudCenter"><div class="metrics"><div><small>WAVE</small><b id="wave">01</b></div><div><small>KO</small><b id="kills">00000</b></div><div><small>COMBO</small><b id="combo">x1.0</b></div><div><small>TIME</small><b id="clock">02:30</b></div></div><div id="status">HOLD TO FIRE • AIM AT THE SWARM</div></div>
 <div class="hudButtons"><button id="muteBtn" aria-label="Mute music">♫</button><button id="pauseBtn" aria-label="Hold to pause" title="Hold to pause">Ⅱ</button></div>
</div>
<div id="bossHUD" hidden><span id="bossLabel">BOSS INCOMING</span><div class="progress"><span id="bossFill"></span></div></div>
<div id="bottomHUD"><button id="ammoLabel" aria-label="Single straight cannon, automatic upgrades">STRAIGHT CANNON <b id="weaponLevel">LV 1 · STRAIGHT</b></button><div id="energy"><span>SUPER</span><div class="progress"><span id="superFill"></span></div><b id="superText">0%</b></div></div>
<button id="superBtn" aria-label="Activate manually charged prism cannon" aria-disabled="true"><b>✦</b><span>AIR<br>RAID</span><small id="superReady">CHARGE</small></button>
<div id="overlay" aria-live="polite"></div>
<div id="flashLayer"></div>
<script async src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<script defer src="crazygames-bridge.js?v=6"></script>

</main>
